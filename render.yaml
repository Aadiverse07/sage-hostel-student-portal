services:
  - type: web
    name: sage-hostel-student-portal
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_KEY
        generateValue: true
      - key: DEMO_STUDENT_PASSWORD
        sync: false

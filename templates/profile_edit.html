<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Edit Profile | SAGE University Hostel</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="{{ url_for('static',filename='css/dashboard.css') }}"><link rel="stylesheet" href="{{ url_for('static',filename='css/profile.css') }}"><style>.edit-card{max-width:900px;margin:25px auto;background:#fff;border-radius:18px;padding:28px;box-shadow:0 18px 45px rgba(15,23,42,.08)}.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.edit-field label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:#718096;margin-bottom:7px}.edit-field input{width:100%;box-sizing:border-box;border:1px solid #dfe6ef;border-radius:10px;padding:12px 13px;font:500 12px Poppins;color:#172033;background:#fbfcfe}.edit-actions{display:flex;gap:10px;margin-top:22px}.edit-actions button,.edit-actions a{border:0;border-radius:10px;padding:11px 16px;text-decoration:none;font:600 11px Poppins;cursor:pointer}.save{background:#173d80;color:#fff}.cancel{background:#eef2f7;color:#334155}.edit-error{padding:11px 13px;border-radius:10px;background:#fff1f2;color:#be123c;font-size:11px;margin-bottom:16px}@media(max-width:700px){.edit-grid{grid-template-columns:1fr}}</style></head><body><aside class="sidebar"><div class="logo"><i class="fa-solid fa-building-columns"></i><span>SAGE HOSTEL</span></div><ul><li onclick="location.href='{{url_for('dashboard')}}'"><i class="fa-solid fa-house"></i> Dashboard</li><li class="active" onclick="location.href='{{url_for('profile')}}'"><i class="fa-solid fa-user"></i> Student Profile</li><li onclick="location.href='{{url_for('room_details')}}'"><i class="fa-solid fa-bed"></i> Room Details</li><li onclick="location.href='{{url_for('fees')}}'"><i class="fa-solid fa-money-check-dollar"></i> Fee Status</li><li onclick="location.href='{{url_for('attendance')}}'"><i class="fa-solid fa-calendar-check"></i> Attendance</li><li><i class="fa-solid fa-bullhorn"></i> Notices</li><li><i class="fa-solid fa-screwdriver-wrench"></i> Complaints</li><li><i class="fa-solid fa-gear"></i> Settings</li><li onclick="location.href='{{url_for('logout')}}'"><i class="fa-solid fa-right-from-bracket"></i> Logout</li></ul></aside><main class="main"><header class="profile-header"><div><div class="eyebrow"><i class="fa-solid fa-user-pen"></i> STUDENT PROFILE</div><h1>Edit My Information</h1><p>Update your own student and contact details.</p></div></header><section class="edit-card">{% if error %}<div class="edit-error"><i class="fa-solid fa-circle-exclamation"></i> {{error}}</div>{% endif %}<form method="POST"><div class="edit-grid"><div class="edit-field"><label>Full Name</label><input name="name" value="{{student['name'] or ''}}" required></div><div class="edit-field"><label>Email Address</label><input type="email" name="email" value="{{student['email'] or ''}}" required></div><div class="edit-field"><label>Mobile Number</label><input name="phone" value="{{student['phone'] or ''}}" required></div><div class="edit-field"><label>Guardian Name</label><input name="guardian_name" value="{{student['guardian_name'] or ''}}"></div><div class="edit-field"><label>Guardian Contact</label><input name="guardian_phone" value="{{student['guardian_phone'] or ''}}"></div><div class="edit-field"><label>Academic Programme</label><input name="branch" value="{{student['branch'] or ''}}"></div><div class="edit-field"><label>Academic Year</label><input name="year" value="{{student['year'] or ''}}"></div><div class="edit-field"><label>Enrollment Number</label><input value="{{student['enrollment']}}" disabled></div></div><div class="edit-actions"><button class="save" type="submit"><i class="fa-solid fa-check"></i> Save Changes</button><a class="cancel" href="{{url_for('profile')}}">Cancel</a></div></form></section></main></body></html>
